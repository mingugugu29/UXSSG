<text x="72" y="62" class="tiny">WOORI SAI  /  DESIGN SYSTEM 2.0</text>
<text x="72" y="122" class="h1">Foundations</text>
<text x="72" y="158" class="small">첨부 HTML의 실제 파스텔 무드와 한국형 모바일 앱 패턴을 기준으로 한 기초 시스템</text>
<text x="1330" y="62" class="cap" text-anchor="end">01 / FOUNDATIONS</text>
<line x1="72" y1="190" x2="1368" y2="190" stroke="#ECE6EF" stroke-width="2"/>
<text x="72" y="250" class="tiny">01  COLOR TOKENS</text>
<text x="72" y="292" class="h2">브랜드 · 기본 UI 컬러</text>
<rect x="72" y="320" width="230" height="72" rx="12" fill="#7E63A8"/>
