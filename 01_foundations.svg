<text x="72" y="735" class="h3">컬러 사용 원칙</text>
<text x="72" y="770" class="body">보라색은 브랜드와 주요 행동, 파스텔은 그룹·상태·감정 구분, 흰색은 콘텐츠 카드에 사용합니다.</text>
<text x="72" y="825" class="tiny">02  TYPOGRAPHY</text>
<text x="72" y="865" class="h2">타이포그래피</text>
<text x="72" y="930" class="h1">우리의 오늘을 함께 기록해요</text>
<text x="72" y="975" class="body">페이지 제목 22px  /  섹션 제목 17px  /  본문 15px  /  보조 정보 11–13px</text>
<text x="760" y="900" class="small">Display · 28px · Bold</text>
<text x="1030" y="900" class="small">Page Title · 22px · Bold</text>
<text x="760" y="955" class="small">Section · 17px · Bold</text>
<text x="1030" y="955" class="small">Card Title · 15px · Bold</text>
<text x="760" y="1010" class="small">Body · 15px · Regular</text>
<text x="1030" y="1010" class="small">Body Small · 13px · Regular</text>
<text x="760" y="1065" class="small">Caption · 11px · Regular</text>
