<text x="72" y="1460" class="tiny">04  MOBILE LAYOUT</text>
<text x="72" y="1500" class="h2">모바일 기준</text>
<text x="72" y="1545" class="body">기준 프레임 390 × 844px  ·  HTML 원본 폭 400px  ·  좌우 패딩 16px  ·  4px 간격 체계</text>
<text x="72" y="1590" class="small">최소 터치 영역 44px  ·  하단 Safe Area 고려  ·  스크롤은 콘텐츠 영역에서만</text>
