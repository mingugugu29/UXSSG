<text x="72" y="62" class="tiny">WOORI SAI  /  DESIGN SYSTEM 2.0</text>
<text x="72" y="122" class="h1">Screen Patterns</text>
<text x="72" y="158" class="small">현재 HTML의 정보 구조를 한국형 모바일 UI 패턴으로 정돈한 화면 설계 가이드</text>
<text x="1330" y="62" class="cap" text-anchor="end">03 / SCREEN PATTERNS</text>
<line x1="72" y1="190" x2="1368" y2="190" stroke="#ECE6EF" stroke-width="2"/>
