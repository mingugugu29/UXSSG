<style>

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.t-meet { background: var(--meet-soft); color: var(--meet); } .t-trip { background: var(--trip-soft); color: var(--trip); } .t-daily { background: var(--daily-soft); color: var(--daily); }
.banner { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.btn { border: 0; border-radius: 14px; padding: 11px 16px; font-weight: 700; background: var(--accent); color: #fff; }

.card { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; }
.rooms { display: grid; gap: 10px; }
.room { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; text-align: left; border: 0; width: 100%; }
.room .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; }
.room h3 { margin: 0; font: 600 16px var(--f-title); overflow-wrap: anywhere; }
.room p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.room .meta { text-align: right; font-size: 12px; color: var(--muted); }
.dday { font: 700 15px var(--f-body); color: var(--ink); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty .big { font-family: var(--f-hand); font-size: 26px; color: var(--ink); margin-bottom: 6px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar .in { max-width: 448px; margin: 0 auto 12px; background: var(--paper); border-radius: 20px; box-shadow: 0 8px 28px rgba(35,37,58,.18); display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; padding: 6px; }
.tabbar button { border: 0; background: none; padding: 9px; border-radius: 14px; font-weight: 700; font-size: 13px; color: var(--muted); }
.tabbar button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tabbar .plus { width: 52px; height: 52px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 28px; line-height: 1; justify-self: center; margin-top: -26px; box-shadow: 0 8px 20px rgba(85,98,240,.4); }

/* room view */
.rhead { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
.rhead h2 { margin: 4px 0 0; font: 700 22px/1.25 var(--f-title); overflow-wrap: anywhere; }
.members { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }

.plan a { color: var(--accent); font-weight: 600; text-decoration: none; }

.composer textarea, .field input, .field select, .field textarea { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; resize: none; }

.addphoto { width: 64px; height: 64px; border-radius: 10px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 22px; cursor: pointer; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.dayh { font-family: var(--f-hand); font-size: 22px; margin: 18px 4px 8px; display: flex; align-items: baseline; gap: 8px; }
.dayh span { font: 600 12px var(--f-body); color: var(--muted); }

.polaroid::before { content: ""; position: absolute; top: -8px; left: 50%; width: 70px; height: 18px; margin-left: -35px; background: var(--tape); transform: rotate(-3deg); border-radius: 2px; }
.polaroid:nth-child(even) { transform: rotate(.6deg); } .polaroid:nth-child(odd) { transform: rotate(-.5deg); }
.pgrid { display: grid; gap: 4px; border-radius: 4px; overflow: hidden; }
.pgrid.n1 { grid-template-columns: 1fr; } .pgrid.n2, .pgrid.n4 { grid-template-columns: 1fr 1fr; } .pgrid.n3 { grid-template-columns: 2fr 1fr; }

.pgrid.n1 img { aspect-ratio: 4/3; }
.caption { font-family: var(--f-hand); font-size: 20px; line-height: 1.35; margin: 8px 2px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.byline { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.byline .av { width: 20px; height: 20px; font-size: 10px; }
.byline .x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12px; }
.status { display: grid; grid-template-columns: 40px 1fr; gap: 10px; }

.status img { width: 100%; border-radius: 12px; margin-top: 8px; max-height: 320px; object-fit: cover; }

/* settle */
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field > span { padding-left: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.exp { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.exp:last-child { border-bottom: 0; }
.exp b { font-weight: 600; overflow-wrap: anywhere; } .exp .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.exp small { color: var(--muted); font-size: 12px; grid-column: 1 / -1; display: flex; gap: 8px; }
.exp small button { border: 0; background: none; color: var(--muted); padding: 0; margin-left: auto; font-size: 12px; }
.total { display: flex; justify-content: space-between; align-items: baseline; }
.total strong { font-size: 24px; font-variant-numeric: tabular-nums; }
.xfer { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.xfer:last-child { border-bottom: 0; }
.xfer .who { font-size: 14px; } .xfer .who b { font-variant-numeric: tabular-nums; }
.xfer.done .who { text-decoration: line-through; color: var(--muted); }
.check { border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.xfer.done .check { background: var(--good); border-color: var(--good); color: #fff; }

/* calendar */
.calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.calhead h2 { margin: 0; font: 700 22px var(--f-title); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { text-align: center; font-size: 11.5px; color: var(--muted); padding: 2px 0 4px; }

  const Store = {

  /** photos for each region: own stamp first, then the newest cover of my trips there */

      <label class="field"><span>메모 (선택)</span><input id="fMemo" maxlength="80" value="${esc(f.memo || "")}" placeholder="회비 3만 원, 늦으면 커피 쏘기"></label>` : ""}
      <button class="btn" type="submit">${f.editId ? "저장" : "방 만들고 초대하기"}</button>

    const f = S.sheet; ["title:fTitle", "date:fDate", "time:fTime", "start:fStart", "end:fEnd", "place:fPlace", "memo:fMemo", "region:fRegion"].forEach((p) => { const [k, id] = p.split(":"); const x = v(id); if (x !== undefined) f[k] = x; });

      ${canPhoto() && S.canWrite ? `<label class="btn" style="text-align:center">${stamp ? "도장 사진 바꾸기" : "사진으로 도장 찍기"}<input id="stampInput" type="file" accept="image/*" hidden></label>` : ""}

  /* ---------- room subscriptions ---------- */
  function openRoom(id, push = true) {
    unsubSub.forEach((u) => u()); unsubSub = []; S.notes = []; S.expenses = [];
    S.roomId = id; S.view = "room"; S.roomTab = "memo"; S.draft = { photos: [], text: "", mood: null, day: null }; S.sheet = null;
    const r = S.rooms[id]; if (r && r.type) S.tab = r.type;
    unsubSub.push(Store.watchSub(id, "notes", (l) => { S.notes = l; resolveNames(l.map((x) => x.by)); if (S.roomId === id) render(); }));
    unsubSub.push(Store.watchSub(id, "expenses", (l) => { S.expenses = l; resolveNames(l.map((x) => x.payer)); if (S.roomId === id) render(); }));
    if (push && location.hash !== "#r-" + id) history.replaceState(null, "", "#r-" + id);
    if (r) resolveNames(memberIds(r));
    render(); window.scrollTo(0, 0);
  }
  function goTab(t) { unsubSub.forEach((u) => u()); unsubSub = []; S.view = t; S.tab = t; S.roomId = null; S.draft = { photos: [], text: "", mood: null, day: null }; if (location.hash) history.replaceState(null, "", location.pathname + location.search); render(); window.scrollTo(0, 0); }

  /* ---------- photos ---------- */
  function shrink(file, max) {
    return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob((b) => (b ? res({ blob: b, preview: c.toDataURL("image/jpeg", 0.6) }) : rej(new Error("사진을 바꾸지 못했어요"))), "image/jpeg", 0.82); };
      img.onerror = () => rej(new Error("이미지를 읽지 못했어요")); img.src = url; });
  }
  async function uploadOne(p) { if (S.mode === "db" && assets) return (await assets.upload(p.blob)).id; return p.preview; }
  async function uploadPhotos(list) { const ids = []; for (const p of list) ids.push(await uploadOne(p)); return ids; }
  async function postNote(r, day, text) {
    if (!text && !S.draft.photos.length && !S.draft.mood) { toast("사진이나 한 줄을 남겨 주세요"); return false; }
    S.busy = true; S.draft.text = text; render();
    const photos = await uploadPhotos(S.draft.photos);
    await Store.addSub(r.id, "notes", { by: S.me, day, text, photos, mood: S.draft.mood || null, at: Date.now() });
    const patch = {}; const cur = (r.noteDays || {})[day];
    if (photos[0] && typeof cur !== "string") patch.noteDays = { [day]: photos[0] }; else if (!cur) patch.noteDays = { [day]: true };
    if (photos[0] && !r.cover) patch.cover = photos[0];
    if (Object.keys(patch).length) await Store.updateRoom(r.id, patch);
    S.draft = { photos: [], text: "", mood: null, day: null }; S.busy = false; return true;
  }

  /* ---------- actions ---------- */
  async function act(a, el, ev) {
    const r = S.roomId && S.rooms[S.roomId];
    const keepText = () => { const t = document.getElementById("noteText"); if (t) S.draft.text = t.value; };
    try {
      switch (a) {
        case "open": openRoom(el.dataset.id); break;
        case "tab": goTab(el.dataset.t); break;
        case "back": goTab(S.tab); break;
        case "new": if (!S.canWrite) return; S.sheet = { type: el.dataset.t && TYPES[el.dataset.t] ? el.dataset.t : "meet", scope: "kr" }; renderSheet(); break;
        case "newTripHere": { const id = el.dataset.id; S.sheet = { type: "trip", scope: REG[id].scope, region: id }; renderSheet(); break; }
        case "pickType": readSheet(); S.sheet.type = el.dataset.t; renderSheet(); break;
        case "pickScope": readSheet(); S.sheet.scope = el.dataset.s; S.sheet.region = null; renderSheet(); break;
        case "closeSheet": S.sheet = null; renderSheet(); break;
        case "editRoom": S.sheet = { editId: r.id, type: r.type, title: r.title, date: r.date, time: r.time, start: r.start, end: r.end, place: r.place, memo: r.memo, region: r.region, scope: r.region ? REG[r.region]?.scope : "kr" }; renderSheet(); break;
        case "invite": {
          const url = location.href.split("#")[0] + "#r-" + r.id;
          const text = `[추억앨범] '${r.title}' 방에 초대할게! 링크를 열고 ‘참여하기’를 눌러 줘\n${url}`;
          try { await navigator.clipboard.writeText(text); toast("초대 문구를 복사했어요. 단톡방에 붙여 넣어 주세요."); } catch { showCopyFallback(text); }
          break; }
        case "join": await Store.updateRoom(r.id, { members: { [S.me]: true } }); toast("방에 참여했어요"); break;
        case "leave": if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "정말 나갈래요?"; return; }
          await Store.updateRoom(r.id, { members: { [S.me]: false } }); goTab(S.tab); toast("방에서 나왔어요"); break;
        case "delRoom": if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "한 번 더 누르면 삭제"; return; }
          await Store.deleteRoom(r.id); goTab(S.tab); toast("방을 삭제했어요"); break;
        case "rtab": S.roomTab = el.dataset.tab; render(); break;
        case "mood": keepText(); S.draft.mood = S.draft.mood === el.dataset.m ? null : el.dataset.m; render(); break;
        case "rmPhoto": keepText(); S.draft.photos.splice(+el.dataset.i, 1); render(); break;
        case "postNote": {
          const text = (document.getElementById("noteText").value || "").trim();
          const dayEl = document.getElementById("noteDay"); const day = (dayEl && dayEl.value) || todayKey();
          if (await postNote(r, day, text)) { render(); toast(r.type === "daily" ? "공유했어요" : "앨범에 붙였어요"); }
          break; }
        case "postCal": {
          const room = S.rooms[document.getElementById("calRoom").value]; if (!room) return;
          const text = (document.getElementById("noteText").value || "").trim();
          if (await postNote(room, S.calSel, text)) { render(); toast(`${room.title}에 붙였어요`); }
          break; }
        case "delNote": await Store.delSub(r.id, "notes", el.dataset.id); break;
        case "among": { const mem = memberIds(r); const cur = new Set(S.draft.among || mem); cur.has(el.dataset.m) ? cur.delete(el.dataset.m) : cur.add(el.dataset.m); S.draft.among = mem.filter((m) => cur.has(m)); const keep = { t: document.getElementById("expTitle").value, a: document.getElementById("expAmt").value, p: document.getElementById("expPayer").value }; render(); document.getElementById("expTitle").value = keep.t; document.getElementById("expAmt").value = keep.a; document.getElementById("expPayer").value = keep.p; break; }
        case "addExp": {
          const title = document.getElementById("expTitle").value.trim(); const amount = parseInt(document.getElementById("expAmt").value.replace(/[^0-9]/g, ""), 10);
          const payer = document.getElementById("expPayer").value; const among = S.draft.among || memberIds(r);
          if (!amount) { toast("금액을 숫자로 적어 주세요"); return; } if (!among.length) { toast("나눌 사람을 한 명 이상 골라 주세요"); return; }
          await Store.addSub(r.id, "expenses", { title: title || "항목", amount, payer, among, by: S.me, at: Date.now() });
          S.draft.among = null; toast("추가했어요"); break; }
        case "delExp": await Store.delSub(r.id, "expenses", el.dataset.id); break;
        case "settle": { const k = el.dataset.k; await Store.updateRoom(r.id, { settled: { [k]: !(r.settled && r.settled[k]) } }); break; }
        case "setAcc": showAccount(); break;
        case "copyAcc": try { await navigator.clipboard.writeText(r.account); toast("계좌를 복사했어요"); } catch { toast("길게 눌러 복사해 주세요"); } break;
        case "calPrev": keepText(); S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() - 1, 1); render(); break;
        case "calNext": keepText(); S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + 1, 1); render(); break;
        case "calDay": keepText(); S.calSel = el.dataset.k; render(); break;
        case "mapMode": S.mapMode = el.dataset.m; S.mapSel = null; render(); break;
        case "mapZoom": S.mapZoom = el.dataset.z; render(); break;
        case "region": { const id = el.dataset.id; if (id === "wKOR") { S.mapMode = "kr"; render(); toast("국내 지도로 바꿨어요"); return; } S.mapSel = id; S.sheet = { kind: "region", id }; render(); break; }
        case "unstamp": { const m = { ...S.stamps }; delete m[el.dataset.id]; await Store.saveStamps(m); S.stamps = m; S.sheet = null; render(); toast("도장을 지웠어요"); break; }
        case "sample": await createSample(); break;
      }
    } catch (e) {
      S.busy = false; render(); console.warn(e);
      const code = e && e.code;
      toast(code === "invalid_argument" ? "저장할 권한이 없어요. 페이지 주인에게 ‘참여자’ 권한을 받아 주세요." : code === "too_large" ? "사진이 너무 커요. 다른 사진을 골라 주세요." : code === "quota_exceeded" ? "저장 공간이 가득 찼어요." : "저장하지 못했어요. 잠시 후 다시 해 주세요.");
      if (code === "invalid_argument") { S.canWrite = false; render(); }
    }
  }
  function showCopyFallback(text) {
    $layer.innerHTML = `<div class="scrim" data-act="closeSheet"><div class="sheet"><h2>초대 문구</h2><p class="small muted" style="margin:0">아래 글을 길게 눌러 복사한 뒤 단톡방에 붙여 넣어 주세요.</p><textarea id="copyBox" rows="4" readonly style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)">${esc(text)}</textarea><button class="btn ghost" data-act="closeSheet">닫기</button></div></div>`;
    const b = document.getElementById("copyBox"); b.focus(); b.select();
  }
  function showAccount() {
    $layer.innerHTML = `<div class="scrim" data-act="closeSheet"><form class="sheet" id="accForm"><h2>입금 계좌</h2><label class="field"><span>은행과 계좌번호, 예금주</span><input id="accInput" maxlength="60" placeholder="카카오뱅크 3333-00-0000000 김친구"></label><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" data-act="closeSheet">닫기</button></form></div>`;
    document.getElementById("accInput").focus();
  }
  async function createSample() {
    const id = rid("r"); const t = new Date(); const d = (n) => dkey(new Date(t.getFullYear(), t.getMonth(), t.getDate() + n));
    await Store.setRoom(id, { type: "meet", title: "(예시) 연말 송년회", date: d(-2), time: "19:00", place: "성수역 3번 출구", memo: "예시 방이에요. 마음껏 눌러 보고 지워도 돼요.", by: S.me, members: { [S.me]: true }, createdAt: Date.now(), noteDays: { [d(-2)]: true } });
    await Store.addSub(id, "notes", { by: S.me, day: d(-2), text: "(예시) 1차 삼겹살, 2차 노래방. 목이 쉬었다", photos: [], mood: null, at: Date.now() });
    await Store.addSub(id, "expenses", { title: "(예시) 1차 고깃집", amount: 96000, payer: S.me, among: [S.me], by: S.me, at: Date.now() });
    openRoom(id); toast("예시 방을 만들었어요. 친구를 초대하면 정산이 나뉘어요.");
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]"); if (!el) return;
    if (el.tagName === "BUTTON" && el.type === "submit" && el.form) return;
    if (el.classList.contains("scrim") && ev.target !== el) return;
    ev.preventDefault(); act(el.dataset.act, el, ev);
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && S.sheet) { S.sheet = null; renderSheet(); }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches(".rg")) { ev.preventDefault(); act("region", ev.target, ev); }
  });
  document.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (ev.target.id === "accForm") { const v = document.getElementById("accInput").value.trim(); if (v) { try { await Store.updateRoom(S.roomId, { account: v }); toast("계좌를 적어 뒀어요"); } catch (e) { toast("저장하지 못했어요"); } } $layer.innerHTML = ""; return; }
    if (ev.target.id !== "roomForm") return;
    readSheet(); const f = S.sheet; if (!f.title) { toast("방 이름을 적어 주세요"); return; }
    if (f.type === "trip" && f.start && f.end && f.end < f.start) { toast("돌아오는 날이 출발보다 빨라요"); return; }
    const base = { title: f.title };
    if (f.type === "meet") Object.assign(base, { date: f.date || "", time: f.time || "", place: f.place || "", memo: f.memo || "" });
    if (f.type === "trip") Object.assign(base, { start: f.start || "", end: f.end || f.start || "", place: f.place || "", memo: f.memo || "", region: f.region || "" });
    try {
      if (f.editId) { await Store.updateRoom(f.editId, base); S.sheet = null; renderSheet(); toast("수정했어요"); }
      else { const id = rid("r"); await Store.setRoom(id, { ...base, type: f.type, by: S.me, members: { [S.me]: true }, createdAt: Date.now(), noteDays: {} }); S.sheet = null; renderSheet(); openRoom(id); toast("방을 만들었어요. 🔗 버튼으로 친구를 초대하세요."); }
    } catch (e) { toast(e && e.code === "invalid_argument" ? "저장할 권한이 없어요." : "만들지 못했어요. 다시 해 주세요."); }
  });
  document.addEventListener("change", async (ev) => {
    if (ev.target.id === "photoInput") {
      const t = document.getElementById("noteText"); if (t) S.draft.text = t.value;
      const r = S.rooms[S.roomId]; const max = r && r.type === "daily" && S.view === "room" ? 1 : 4;
      const files = [...ev.target.files].slice(0, max - S.draft.photos.length);
      for (const f of files) { try { S.draft.photos.push(await shrink(f, S.mode === "db" ? 1600 : 640)); } catch (e) { toast(e.message); } }
      render();
    }
    if (ev.target.id === "stampInput") {
      const id = S.sheet && S.sheet.id; const f = ev.target.files[0]; if (!id || !f) return;
      try { toast("도장 찍는 중…"); const p = await shrink(f, S.mode === "db" ? 1200 : 480); const pid = await uploadOne(p); const m = { ...S.stamps, [id]: pid }; await Store.saveStamps(m); S.stamps = m; render(); toast(`${REG[id].name}에 도장 쾅!`); }
      catch (e) { toast(e && e.code === "too_large" ? "사진이 너무 커요." : "도장을 찍지 못했어요. 다시 해 주세요."); }
    }
    if (ev.target.id === "calRoom") S.draft.calRoom = ev.target.value;
  });
  document.addEventListener("input", (ev) => { if (ev.target.id === "noteText") S.draft.text = ev.target.value; if (ev.target.id === "noteDay") S.draft.day = ev.target.value; });
  window.addEventListener("hashchange", () => { const m = location.hash.match(/^#r-([A-Za-z0-9]+)$/); if (m && S.rooms[m[1]]) openRoom(m[1], false); });

  /* ---------- boot ---------- */
  let booted = false;
  function startRooms() {
    Store.watchStamps((m) => { S.stamps = m || {}; if (booted) render(); });
    Store.watchRooms((rooms) => {
      S.rooms = rooms; resolveNames(Object.values(rooms).flatMap(memberIds));
      if (!booted) { booted = true; const m = location.hash.match(/^#r-([A-Za-z0-9]+)$/); if (m && rooms[m[1]]) { openRoom(m[1], false); return; } }
      render();
    });
  }
  function goLocal() { S.mode = "local"; S.me = "me"; S.names.me = "나"; db = null; startRooms(); }
  async function boot() {
    const timer = setTimeout(() => { if (S.mode === "loading") goLocal(); }, 10000);
    try {
      const c = window.claude;
      if (c && c.use) {
        const [d, u] = await Promise.all([c.use("db"), c.use("user")]);
        if (S.mode !== "loading") return;
        user = u; const id = u ? await u.id() : null;
        if (d && id) {
          clearTimeout(timer); db = d; S.mode = "db"; S.me = id;
          const me = await u.me(); if (me && me.name) S.names[id] = me.name;
          const cw = await u.can("data.write"); S.canWrite = cw !== false;
          try { assets = await c.use("assets"); } catch { assets = null; }
          startRooms(); return;
        }
      }
    } catch (e) { console.warn(e); }
    clearTimeout(timer); if (S.mode === "loading") goLocal();
  }
  boot();
})();
</script>
