<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MONIT · 모닛</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── plytoo tokens (Wanted DS 상속 + Violet/Lime/Pink 브랜드) ── */
:root{
  --violet-50:#F6F5FF;--violet-100:#EDEAFF;--violet-200:#D8D3FF;--violet-300:#B6ADFF;--violet-400:#8F82FF;--violet-500:#6155F5;--violet-600:#4D40C7;--violet-700:#3C319F;--violet-800:#2D2578;--violet-900:#1F1A51;
  --lime-100:#EFFBD4;--lime-300:#B9F36B;--lime-700:#41641C;
  --pink-100:#FFE4ED;--pink-300:#FF8DAD;--pink-400:#F56F98;--pink-600:#B72F61;
  --primary:#6155F5;--on-primary:#fff;--primary-strong:#4D40C7;
  --label:#171719;--label-alt:rgba(55,56,60,.61);--label-assist:rgba(55,56,60,.28);
  --bg:#fff;--bg-alt:#F7F7F8;--line:rgba(112,115,124,.22);--fill:rgba(112,115,124,.08);
  --content-lime:#41641C;--content-pink:#B72F61;
  --shadow:0 2px 12px rgba(23,23,25,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --primary:#B6ADFF;--on-primary:#1F1A51;--primary-strong:#D8D3FF;
  --label:#F7F7F8;--label-alt:rgba(194,196,200,.75);--label-assist:rgba(194,196,200,.3);
  --bg:#1B1C1E;--bg-alt:#141415;--line:rgba(148,151,158,.22);--fill:rgba(148,151,158,.16);
  --content-lime:#B9F36B;--content-pink:#FF8DAD;--shadow:0 2px 12px rgba(0,0,0,.5);color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:400 15px/1.47 'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--label);background:var(--bg-alt)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
.app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.views{flex:1;position:relative;min-height:0;z-index:0}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:0 16px 24px}
.view.on{display:block}
#v-map{padding:0;overflow:hidden;z-index:0}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--label-assist)}
.tabbar button.on{color:var(--primary)}
.tabbar svg{width:24px;height:24px}
/* type */
.title{font-size:26px;line-height:1.3;font-weight:700;letter-spacing:-.02em}
.heading{font-size:18px;font-weight:700;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.caption{font-size:12px;color:var(--label-alt)}
.mut{color:var(--label-alt);font-size:14px}
.logo{font-weight:800;letter-spacing:.04em;color:var(--primary);font-size:18px}
.top{padding:20px 0 4px}
/* buttons */
.btn{height:48px;border-radius:12px;padding:0 20px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%}
.btn.p{background:var(--primary);color:var(--on-primary)}
.btn.s{border:1px solid var(--line)}
.btn.sm{height:36px;font-size:14px;width:auto;padding:0 14px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--primary);color:var(--on-primary)}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--fill);color:var(--label-alt)}
.badge.UPCOMING{background:var(--violet-100);color:var(--violet-700)}
.badge.ONGOING{background:var(--lime-300);color:var(--violet-900)}
.badge.PAST_EMPTY{background:var(--pink-400);color:var(--violet-900)}
@media (prefers-color-scheme:dark){.badge.UPCOMING{background:var(--violet-800);color:var(--violet-200)}}
/* hero */
.hero{background:var(--violet-500);color:#fff;border-radius:20px;padding:20px;margin-top:16px;position:relative;overflow:hidden}
.hero p{opacity:.85;font-size:14px}
.hero strong{display:block;font-size:24px;line-height:1.3;margin:4px 0 14px;letter-spacing:-.02em}
.hero .dot{position:absolute;right:-18px;top:-18px;width:88px;height:88px;border-radius:50%;background:var(--lime-300)}
.hero .dot2{position:absolute;right:50px;top:30px;width:34px;height:34px;border-radius:50%;background:var(--pink-400)}
.hero .btn{background:#fff;color:var(--violet-700);height:44px}
/* cards */
.card{display:flex;gap:12px;padding:10px;border-radius:16px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left;align-items:center}
.card .th{width:64px;height:64px;border-radius:12px;flex:none;background:var(--img) center/cover,linear-gradient(135deg,var(--violet-300),var(--pink-300))}
.card b{display:block;font-size:16px;margin-bottom:2px}
.hs{display:flex;gap:10px;overflow:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hs .mc{flex:none;width:150px;text-align:left}
.mc .th{width:150px;height:150px;border-radius:16px;background:var(--img) center/cover,linear-gradient(135deg,var(--violet-300),var(--pink-300));margin-bottom:6px}
.mc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--label-alt)}
/* map */
#map{position:absolute;inset:0;z-index:0;background:var(--bg-alt)}
.mtop{position:absolute;top:0;left:0;right:0;z-index:1000;padding:12px 16px;display:flex;gap:8px;overflow:auto;scrollbar-width:none;background:linear-gradient(var(--bg),transparent)}
.mtop .chip{background:var(--bg);box-shadow:var(--shadow)}
.mtop .chip.on{background:var(--primary)}
.fab{position:absolute;right:16px;bottom:16px;z-index:1000;width:48px;height:48px;border-radius:24px;background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--primary)}
.mempty{position:absolute;left:16px;right:16px;bottom:80px;z-index:1000;background:var(--bg);border-radius:16px;padding:16px;box-shadow:var(--shadow);text-align:center}
.pin{width:56px;height:56px;border-radius:16px;border:3px solid #fff;position:relative;background:var(--img) center/cover,linear-gradient(135deg,var(--violet-300),var(--pink-300));box-shadow:0 4px 12px rgba(31,26,81,.4);transition:transform .15s}
.pin:hover{transform:scale(1.08)}
.pin::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top:8px solid #fff;border-bottom:0}
.pin b{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--violet-500);color:#fff;font-size:12px;line-height:22px;text-align:center;border:2px solid #fff}
.pin.big{width:68px;height:68px;border-radius:20px}
.pin.big b{background:var(--lime-300);color:var(--violet-900)}
.pl{position:absolute;top:68px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;padding:1px 8px;border-radius:8px;background:#fff;color:var(--violet-900);box-shadow:0 1px 4px rgba(0,0,0,.2);display:none}
.labels .pl{display:block}
/* sheet / overlays */
.back{position:absolute;inset:0;background:rgba(23,23,25,.52);z-index:60;display:none;align-items:flex-end}
.back.on{display:flex}
.sheet{width:100%;max-height:86%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;margin-bottom:12px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--label-alt);margin:14px 0 6px}
.in{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--label);padding:0 14px;font:inherit}
.in:focus{outline:2px solid var(--primary);outline-offset:-1px}
.plist{max-height:190px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px}
.plist button{display:flex;justify-content:space-between;width:100%;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.plist button:last-child{border:0}
.plist span{color:var(--label-alt);font-size:13px}
.chip.sel{background:var(--violet-100);color:var(--violet-700)}
.chip.sel button{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid .ph{aspect-ratio:1;border-radius:8px;background:var(--img) center/cover,linear-gradient(135deg,var(--violet-300),var(--pink-300));width:100%}
.strip{display:flex;gap:6px;overflow:auto;margin:10px 0}
.strip .ph{flex:none;width:84px;height:84px;border-radius:12px;background:var(--img) center/cover,linear-gradient(135deg,var(--violet-300),var(--pink-300))}
#detail{position:absolute;inset:0;z-index:40;background:var(--bg);transform:translateX(100%);transition:transform .25s;overflow:auto;padding-bottom:96px}
#detail.on{transform:none}
.dhero{height:220px;background:var(--img) center/cover,linear-gradient(135deg,var(--violet-500),var(--pink-400));position:relative}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 40%)}
.bk{position:absolute;top:12px;left:12px;z-index:2;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.92);color:#171719;display:grid;place-items:center}
.dbody{padding:0 16px}
.dbody .title{margin-top:16px}
.av{width:30px;height:30px;border-radius:15px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--bg);margin-left:-8px;flex:none}
.av:first-child{margin-left:0}
.av.c0{background:var(--violet-500);color:#fff}.av.c1{background:var(--lime-300);color:var(--violet-900)}.av.c2{background:var(--pink-400);color:var(--violet-900)}.av.c3{background:var(--violet-700);color:#fff}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.entry{margin-top:20px}
.entry .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.entry .hd .av{margin:0;border:0}
.entry p{margin-top:8px}
.cta{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:5}
#lb{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;color:#fff}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:70%;border-radius:12px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:80;background:var(--violet-900);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.prev{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.prev .ph{aspect-ratio:1;border-radius:10px;background:var(--img) center/cover}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="views">
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-map">
      <div id="map"></div>
      <div class="mtop" id="mtop"></div>
      <button class="fab" data-act="fit" aria-label="전국 보기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4M17 12h4M12 3v4M12 17v4"/><circle cx="12" cy="12" r="4"/></svg></button>
      <div class="mempty" id="mkey" hidden></div>
      <div class="mempty" id="mempty" hidden><b>장소를 연결한 추억이 아직 없어요</b><p class="mut">사진을 올릴 때 장소를 고르면 지도에 섬네일이 남아요.</p></div>
    </section>
    <section class="view" id="v-archive"></section>
    <div id="detail"></div>
  </div>
  <nav class="tabbar">
    <button class="on" data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>홈</button>
    <button data-act="tab" data-v="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>추억 지도</button>
    <button data-act="tab" data-v="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 15l4-4 4 4 3-3 5 5"/></svg>보관함</button>
  </nav>
  <div class="back" id="back"><div class="sheet" id="sheet"></div></div>
  <div id="lb"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="config.js"></script>
<script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fdate=s=>{const [y,m,d]=s.split('-');return `${y}.${+m}.${+d}`};
const ph=s=>`https://picsum.photos/seed/monit-${s}/480/480`; // 데모용 임시 사진
const ME='나';
// Google Cloud Console → API 및 서비스 → 사용자 인증 정보에서 만든 "Maps JavaScript API" 키를 여기에 붙여넣기.
// 키는 반드시 HTTP 리퍼러(내 도메인)와 Maps JavaScript API로 제한하세요.
const GMAPS_KEY=window.GMAPS_KEY||''; // config.js(깃에 올리지 않음)에서 읽음. config.example.js 참고

/* 전국 장소 프리셋: [key,name,region,lat,lng] — 지도 API 없이도 장소 연결 가능 (PRD: 수동 선택 기본) */
const PLACES=[
['seongsu','성수동 카페거리','서울',37.5446,127.0557],['hongdae','홍대 거리','서울',37.5563,126.9236],['bukchon','북촌 한옥마을','서울',37.5826,126.9830],
['wolmi','월미도','인천',37.4745,126.5958],['suwon','수원 화성','경기',37.2870,127.0146],['gapyeong','가평 쁘띠프랑스','경기',37.7165,127.4884],
['chuncheon','춘천 소양강 스카이워크','강원',37.8946,127.7330],['sokcho','속초 해수욕장','강원',38.1912,128.6012],['anmok','강릉 안목해변','강원',37.7716,128.9487],
['daejeon','대전 성심당','대전',36.3274,127.4274],['boryeong','보령 대천해수욕장','충남',36.3036,126.5136],['danyang','단양 도담삼봉','충북',36.9958,128.3640],
['jeonju','전주 한옥마을','전북',35.8153,127.1530],['gunsan','군산 근대역사박물관','전북',35.9875,126.7108],
['yeosu','여수 낭만포차','전남',34.7378,127.7428],['suncheon','순천만 국가정원','전남',34.9318,127.5090],['damyang','담양 죽녹원','전남',35.3256,126.9867],['mokpo','목포 유달산','전남',34.7937,126.3692],['boseong','보성 녹차밭','전남',34.7690,127.0800],
['hwangridan','경주 황리단길','경북',35.8386,129.2100],['andong','안동 하회마을','경북',36.5390,128.5186],['pohang','포항 호미곶','경북',36.0766,129.5700],
['daegu','대구 동성로','대구',35.8690,128.5945],['ulsan','울산 간절곶','울산',35.3604,129.3603],
['haeundae','부산 해운대','부산',35.1587,129.1604],['gamcheon','감천문화마을','부산',35.0975,129.0106],['gwangalli','광안리 해변','부산',35.1532,129.1186],
['tongyeong','통영 동피랑','경남',34.8450,128.4239],['geoje','거제 바람의 언덕','경남',34.7390,128.6660],['namhae','남해 독일마을','경남',34.7740,127.9060],
['seongsan','제주 성산일출봉','제주',33.4580,126.9425],['aewol','제주 애월','제주',33.4620,126.3100],['hyeopjae','제주 협재해변','제주',33.3940,126.2390],['seogwipo','제주 서귀포 올레시장','제주',33.2470,126.5650]
];
const PM=Object.fromEntries(PLACES.map(p=>[p[0],{id:p[0],name:p[1],region:p[2],lat:p[3],lng:p[4]}]));

/* ── 데이터 ── */
const KEY='monit.v1';
function seed(){
  const N=(pl,by,note,...s)=>({id:uid(),placeId:pl,by,note,photos:s.map(ph)});
  const E=(title,date,m,en,planned)=>({id:uid(),title,date,members:m,entries:en,planned:planned||null,token:uid()+uid()});
  const all=[ME,'지현','민수','서연'];
  return {events:[
    E('제주 3박4일 우정여행','2026-10-10',all,[N('seongsan','지현','일출 보려고 새벽 4시 기상 ☀️','jeju1','jeju2','jeju3'),N('aewol','나','애월 카페 뷰 미쳤다','jeju4','jeju5','jeju6'),N('hyeopjae','민수','물 색깔 실화?','jeju7','jeju8')]),
    E('부산 맛집 투어','2026-09-20',[ME,'지현','서연'],[N('haeundae',ME,'','bs1','bs2'),N('gamcheon','서연','골목 사진 맛집','bs3','bs4','bs5'),N('gwangalli','지현','광안대교 야경','bs6')]),
    E('강릉 당일치기','2026-08-15',[ME,'민수'],[N('anmok','민수','커피 한 잔','gn1','gn2')]),
    E('지현 생일 파티','2026-07-04',all,[N('seongsu','서연','생일 축하해 🎂','sj1','sj2','sj3')]),
    E('전주 한옥마을','2026-05-03',[ME,'지현','민수'],[N('jeonju','지현','한복 입고 비빔밥','jj1','jj2')]),
    E('경주 벚꽃 나들이','2026-04-05',[ME,'서연'],[N('hwangridan',ME,'','gj1','gj2')]),
    E('여수 밤바다','2026-03-21',[ME,'민수','서연'],[N('yeosu','민수','','ys1','ys2')]),
    E('성수 팝업 구경','2026-11-01',[ME,'지현'],[N('seongsu','지현','','sj4','sj5')]),
    E('홍대 저녁','2026-10-31',[ME,'민수','서연'],[N('hongdae',ME,'','hd1','hd2')]),
    E('보드게임 카페','2026-11-07',[ME,'지현'],[]),
    E('속초 겨울바다','2026-11-21',[ME,'지현','민수'],[],'sokcho')
  ]};
}
let S;try{S=JSON.parse(localStorage[KEY])}catch{}
if(!S||!S.events)S=seed();
const save=()=>{try{localStorage[KEY]=JSON.stringify(S)}catch{toast('저장 공간이 부족해요. 사진 수를 줄여보세요')}};
const evById=id=>S.events.find(e=>e.id===id);
const status=e=>{const t=today();return e.date>t?'UPCOMING':e.date===t?'ONGOING':e.entries.length?'MEMORY':'PAST_EMPTY'};
const SL={UPCOMING:'다가오는 약속',ONGOING:'진행 중',MEMORY:'추억',PAST_EMPTY:'사진 추가 대기'};
const cover=e=>e.entries[0]?.photos[0]||'';
const cssimg=u=>u?`--img:url('${u}')`:'--img:none';
const av=(n,i)=>`<span class="av c${i%4}">${esc(n[0])}</span>`;

/* 장소별 집계: 한 장소 = 핀 하나, 방문 횟수 = 서로 다른 이벤트 수 */
function agg(filter){
  const m=new Map();
  S.events.forEach(ev=>ev.entries.forEach(en=>{
    if(!en.placeId||!en.photos.length||(filter&&en.by!==filter)||!PM[en.placeId])return;
    const a=m.get(en.placeId)||{p:PM[en.placeId],evs:new Map(),n:0,thumb:'',td:''};
    a.n+=en.photos.length;
    a.evs.set(ev.id,(a.evs.get(ev.id)||[]).concat(en.photos));
    if(ev.date>=a.td){a.td=ev.date;a.thumb=en.photos[0]}
    m.set(en.placeId,a);
  }));
  return m;
}

/* ── 렌더 ── */
const evCard=e=>{const s=status(e);const pl=new Set(e.entries.map(x=>x.placeId).filter(Boolean)).size;
  return `<button class="card" data-act="open" data-id="${e.id}"><div class="th" style="${cssimg(cover(e))}"></div><div style="min-width:0"><b>${esc(e.title)}</b><div class="caption">${fdate(e.date)} · ${e.members.length}명${pl?` · ${pl}곳`:''}</div><span class="badge ${s}">${SL[s]}</span></div></button>`};
function renderHome(){
  const A=agg(),photos=[...A.values()].reduce((t,a)=>t+a.n,0),regions=new Set([...A.values()].map(a=>a.p.region)).size;
  const up=S.events.filter(e=>['UPCOMING','ONGOING'].includes(status(e))).sort((a,b)=>a.date.localeCompare(b.date));
  const wait=S.events.filter(e=>status(e)==='PAST_EMPTY');
  const rec=S.events.filter(e=>status(e)==='MEMORY').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  $('#v-home').innerHTML=`<div class="top"><span class="logo">MONIT</span></div>
  <div class="hero"><i class="dot"></i><i class="dot2"></i><p>약속이 끝나면, 우리의 추억이 시작돼요</p><strong>${regions}개 지역 · ${A.size}곳<br>사진 ${photos}장이 쌓였어요</strong><button class="btn" data-act="new">+ 새 약속 만들기</button></div>
  ${up.length?`<h2 class="heading">다가오는 약속</h2>${up.map(evCard).join('')}`:''}
  ${wait.length?`<h2 class="heading">사진을 기다리는 약속</h2>${wait.map(evCard).join('')}`:''}
  <h2 class="heading">최근 추억 <button class="caption" data-act="tab" data-v="archive">전체 보기</button></h2>
  ${rec.length?`<div class="hs">${rec.map(e=>`<button class="mc" data-act="open" data-id="${e.id}"><div class="th" style="${cssimg(cover(e))}"></div><b>${esc(e.title)}</b><span class="caption">${fdate(e.date)}</span></button>`).join('')}</div>`:'<div class="empty">아직 추억이 없어요. 첫 약속을 만들어보세요.</div>'}`;
}
function renderArchive(){
  const L=[...S.events].sort((a,b)=>b.date.localeCompare(a.date));let g='',h='<div class="top"><h1 class="title">추억 보관함</h1></div>';
  L.forEach(e=>{const k=e.date.slice(0,4)+'년 '+(+e.date.slice(5,7))+'월';if(k!==g){g=k;h+=`<h2 class="heading">${k}</h2>`}h+=evCard(e)});
  $('#v-archive').innerHTML=h;
}

/* ── 지도 ── */
let map,cluster,PA=new Map(),filt=null,fitted=false;
const pinHtml=(t,c,n,big)=>`<div class="pin${big?' big':''}" style="${cssimg(t)}">${c>1||big?`<b>${c}</b>`:''}</div>${n?`<span class="pl">${esc(n)}</span>`:''}`;
const mkEl=(html,w,h)=>{const e=document.createElement('div');e.style.cssText=`position:relative;width:${w}px;height:${h}px`;e.innerHTML=html;return e};
const keyMsg=m=>{$('#mkey').innerHTML=`<b>${m}</b><p class="mut">index.html 상단 GMAPS_KEY에 Google Maps API 키를 넣어주세요.</p>`;$('#mkey').hidden=false};
window.gm_authFailure=()=>keyMsg('Google Maps API 키가 올바르지 않아요');
let gmP;
const loadGM=()=>gmP||(gmP=new Promise((ok,no)=>{const s=document.createElement('script');
  window.__gmReady=ok; // Google이 API 준비를 끝내면 호출 (onload 시점에는 importLibrary가 아직 없을 수 있음)
  s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GMAPS_KEY)}&v=weekly&language=ko&region=KR&loading=async&callback=__gmReady`;
  s.onerror=no;document.head.append(s)}));
async function initMap(){
  if(map)return true;
  if(!GMAPS_KEY){keyMsg('Google Maps API 키가 필요해요');return false}
  try{
    await loadGM();
    const {Map}=await google.maps.importLibrary('maps');
    const {AdvancedMarkerElement}=await google.maps.importLibrary('marker');
    window.AMark=AdvancedMarkerElement;
    // DEMO_MAP_ID: 개발용. 운영 전 Cloud Console에서 만든 Map ID로 교체
    map=new Map($('#map'),{center:{lat:36.3,lng:127.8},zoom:7,minZoom:6,mapId:'DEMO_MAP_ID',disableDefaultUI:true,gestureHandling:'greedy',
      restriction:{latLngBounds:{north:40.5,south:30,east:134,west:121}}});
    cluster=new markerClusterer.MarkerClusterer({map,markers:[],renderer:{render:({position,markers})=>{
      const top=markers.slice().sort((a,b)=>b._n-a._n)[0];
      return new AMark({position,content:mkEl(pinHtml(top._thumb,markers.length,'',true),68,78)})}}});
    map.addListener('zoom_changed',()=>$('#map').classList.toggle('labels',map.getZoom()>=9));
    return true;
  }catch(e){console.error(e);keyMsg('Google Maps를 불러오지 못했어요');return false}
}
async function renderMap(){
  if(!await initMap())return;
  const names=[...new Set(S.events.flatMap(e=>e.entries.map(x=>x.by)))];
  $('#mtop').innerHTML=['전체',...names].map(n=>`<button class="chip${(n==='전체'?!filt:filt===n)?' on':''}" data-act="filter" data-n="${esc(n)}">${n==='전체'?'전체':n===ME?'내가 찍은 사진':esc(n)+'의 사진'}</button>`).join('');
  PA=agg(filt);cluster.clearMarkers();
  cluster.addMarkers([...PA.values()].map(a=>{
    const m=new AMark({position:{lat:a.p.lat,lng:a.p.lng},content:mkEl(pinHtml(a.thumb,a.evs.size,a.p.name),56,66)});
    m._n=a.n;m._thumb=a.thumb;m.addListener('click',()=>openPlace(a.p.id));return m}));
  $('#mempty').hidden=PA.size>0;
  if(!fitted||!PA.size){fitAll();fitted=true}
}
function fitAll(){
  if(!map)return;
  if(!PA.size){map.setCenter({lat:36.3,lng:127.8});map.setZoom(7);return}
  const bb=new google.maps.LatLngBounds();PA.forEach(a=>bb.extend({lat:a.p.lat,lng:a.p.lng}));
  map.fitBounds(bb,70);
  google.maps.event.addListenerOnce(map,'idle',()=>{if(map.getZoom()>9)map.setZoom(9)});
}
function openPlace(id){
  const a=PA.get(id);if(!a)return;
  const evs=[...a.evs].map(([eid,ph])=>({e:evById(eid),ph})).sort((x,y)=>y.e.date.localeCompare(x.e.date));
  const mates=[...new Set(evs.flatMap(x=>x.e.members).filter(n=>n!==ME))];
  sheet(`<h2>${esc(a.p.name)}</h2><div class="row"><span class="badge">${esc(a.p.region)}</span><span class="mut">${a.evs.size}번 방문 · 사진 ${a.n}장</span></div>
  ${mates.length?`<p class="caption" style="margin-top:8px">함께한 친구 ${mates.map(esc).join(', ')}</p>`:''}
  <div class="strip">${evs.flatMap(x=>x.ph).slice(0,10).map(u=>`<div class="ph" style="${cssimg(u)}"></div>`).join('')}</div>
  ${evs.map(x=>`<button class="card" data-act="open" data-id="${x.e.id}"><div class="th" style="${cssimg(x.ph[0])}"></div><div><b>${esc(x.e.title)}</b><span class="caption">${fdate(x.e.date)} · 사진 ${x.ph.length}장</span></div></button>`).join('')}`);
}

/* ── 이벤트 상세 ── */
let cur=null;
function renderDetail(){
  const e=evById(cur);if(!e){$('#detail').classList.remove('on');return}
  const s=status(e),pls=[...new Set(e.entries.map(x=>x.placeId).filter(Boolean))];
  $('#detail').innerHTML=`<div class="dhero" style="${cssimg(cover(e))}"><button class="bk" data-act="back" aria-label="뒤로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button></div>
  <div class="dbody"><h1 class="title">${esc(e.title)}</h1>
  <div class="row" style="margin-top:8px"><span class="badge ${s}">${SL[s]}</span><span class="mut">${fdate(e.date)}</span></div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><div class="row" style="gap:0">${e.members.map(av).join('')}<span class="caption" style="margin-left:8px">${e.members.length}명</span></div><button class="btn s sm" data-act="invite">초대 링크 복사</button></div>
  <p class="caption" style="margin-top:8px">🔒 멤버 전용 · 링크만으로는 사진이 보이지 않고, 호스트 승인 후 참여해요</p>
  ${e.planned&&PM[e.planned]?`<p class="mut" style="margin-top:12px">예정 장소 · ${esc(PM[e.planned].name)}</p>`:''}
  ${pls.length?`<h2 class="heading">다녀온 장소</h2><div class="row">${pls.map(id=>PM[id]?`<button class="chip" data-act="focus" data-id="${id}">📍 ${esc(PM[id].name)}</button>`:'').join('')}</div>`:''}
  <h2 class="heading">기록</h2>
  ${e.entries.length?e.entries.map((en,ei)=>`<div class="entry"><div class="hd">${av(en.by,e.members.indexOf(en.by)<0?0:e.members.indexOf(en.by))}<b>${esc(en.by)}</b>${en.placeId&&PM[en.placeId]?`<span class="caption">· ${esc(PM[en.placeId].name)}</span>`:'<span class="caption">· 장소 없음</span>'}</div>
    <div class="grid">${en.photos.map((u,pi)=>`<button class="ph" style="${cssimg(u)}" data-act="lb" data-e="${ei}" data-p="${pi}"></button>`).join('')}</div>${en.note?`<p>${esc(en.note)}</p>`:''}</div>`).join(''):'<div class="empty">아직 기록이 없어요.<br>사진 한 장이면 충분해요.</div>'}
  </div><div class="cta"><button class="btn p" data-act="add">사진 추가</button></div>`;
  $('#detail').classList.add('on');
}

/* ── 시트 ── */
const sheet=h=>{$('#sheet').innerHTML=h;$('#back').classList.add('on')};
const closeSheet=()=>$('#back').classList.remove('on');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

function placePicker(root,init,onSet){
  let sel=init;
  const draw=()=>{
    if(sel){root.innerHTML=`<span class="chip sel">📍 ${esc(PM[sel].name)} <button data-c aria-label="장소 제거">✕</button></span>`;root.querySelector('[data-c]').onclick=()=>{sel=null;onSet(null);draw()};return}
    root.innerHTML=`<input class="in" placeholder="장소 검색 (예: 제주, 해운대)"><div class="plist"></div>`;
    const inp=root.querySelector('input'),ls=root.querySelector('.plist');
    const fl=()=>{const q=inp.value.trim();ls.innerHTML=PLACES.filter(p=>!q||p[1].includes(q)||p[2].includes(q)).map(p=>`<button data-k="${p[0]}"><b>${p[1]}</b><span>${p[2]}</span></button>`).join('')||'<p class="mut" style="padding:12px">검색 결과가 없어요</p>'};
    inp.oninput=fl;fl();
    ls.onclick=e=>{const b=e.target.closest('[data-k]');if(b){sel=b.dataset.k;onSet(sel);draw()}};
  };draw();
}
function newEvent(){
  let pl=null;
  sheet(`<h2>새 약속</h2><label class="f">제목 (필수)</label><input class="in" id="nt" maxlength="40" placeholder="예: 성수동 생일 모임">
  <label class="f">날짜 (필수)</label><input class="in" id="nd" type="date" value="${today()}">
  <label class="f">예정 장소 (선택)</label><div id="np"></div>
  <p class="caption" style="margin:14px 0">🔒 비공개로 시작해요. 초대한 친구는 승인 후 참여할 수 있어요.</p><button class="btn p" id="ns">만들기</button>`);
  placePicker($('#np'),null,v=>pl=v);
  $('#ns').onclick=()=>{const t=$('#nt').value.trim(),d=$('#nd').value;
    if(!t)return toast('제목을 입력해주세요');if(!d)return toast('날짜를 선택해주세요');
    const e={id:uid(),title:t,date:d,members:[ME],entries:[],planned:pl,token:uid()+uid()};
    S.events.push(e);save();closeSheet();renderAll();openEvent(e.id)};
}
function addPhotos(){
  const e=evById(cur);let photos=[],pl=null,busy=false;
  sheet(`<h2>사진 추가</h2><label class="btn s" style="cursor:pointer">📷 사진 선택 (여러 장)<input id="af" type="file" accept="image/*" multiple hidden></label>
  <div class="prev" id="ap"></div>
  <label class="f">장소 연결 (선택) — 연결하면 지도에 섬네일 핀이 생겨요</label><div id="apl"></div>
  <label class="f">한 줄 메모 (선택)</label><input class="in" id="an" maxlength="80" placeholder="이날의 기억을 남겨요">
  <button class="btn p" id="au" style="margin-top:18px">올리기</button>`);
  placePicker($('#apl'),null,v=>pl=v);
  $('#af').onchange=async ev=>{busy=true;const fs=[...ev.target.files];let bad=0;
    for(const f of fs){const u=await shrink(f);u?photos.push(u):bad++}
    busy=false;$('#ap').innerHTML=photos.map(u=>`<div class="ph" style="${cssimg(u)}"></div>`).join('');if(bad)toast(`${bad}장은 읽을 수 없어 제외했어요`)};
  $('#au').onclick=()=>{if(busy)return;if(!photos.length)return toast('사진을 한 장 이상 선택해주세요');
    e.entries.push({id:uid(),placeId:pl,by:ME,note:$('#an').value.trim(),photos});save();closeSheet();renderAll();
    toast(pl?'지도에 추억 핀이 생겼어요 📍':'타임라인에 추가했어요. 장소를 연결하면 지도에도 보여요')};
}
// 장소 EXIF는 읽지 않음: PRD 11.3 — 사용자 확인 없이 위치를 공개하지 않는다
const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);
  i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};
  i.onerror=()=>r(null);i.src=u});

/* ── 내비게이션·이벤트 ── */
function go(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#detail').classList.remove('on');cur=null;
  if(v==='map')renderMap();
}
function openEvent(id){closeSheet();cur=id;renderDetail()}
function renderAll(){renderHome();renderArchive();if(map)renderMap();if(cur)renderDetail()}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(!t){if(ev.target.id==='back')closeSheet();if(ev.target.id==='lb')$('#lb').classList.remove('on');return}
  const d=t.dataset;
  ({
    tab:()=>go(d.v),new:newEvent,open:()=>openEvent(d.id),back:()=>{$('#detail').classList.remove('on');cur=null},
    add:addPhotos,fit:()=>{fitted=false;fitAll()},filter:()=>{filt=d.n==='전체'?null:d.n;renderMap().then(fitAll)},
    invite:()=>{const e=evById(cur),url=`https://monit.app/i/${e.token}`;try{navigator.clipboard.writeText(url)}catch{}toast('초대 링크를 복사했어요 · 호스트 승인 후 참여할 수 있어요')},
    focus:()=>{go('map');map&&PA.get(d.id)&&(map.setZoom(13),map.panTo({lat:PM[d.id].lat,lng:PM[d.id].lng}),openPlace(d.id))},
    lb:()=>{const e=evById(cur),en=e.entries[d.e],u=en.photos[d.p];
      $('#lb').innerHTML=`<img src="${u}" alt=""><div>${esc(en.by)}${en.placeId&&PM[en.placeId]?' · '+esc(PM[en.placeId].name):''}${en.note?'<br>'+esc(en.note):''}</div>
      <div class="row"><button class="btn sm s" style="color:#fff;border-color:#fff4" data-act="lbx">닫기</button>${en.by===ME?`<button class="btn sm s" style="color:#FF8DAD;border-color:#fff4" data-act="lbd" data-e="${d.e}" data-p="${d.p}">삭제</button>`:''}</div>`;$('#lb').classList.add('on')},
    lbx:()=>$('#lb').classList.remove('on'),
    lbd:()=>{const e=evById(cur),en=e.entries[d.e];if(!confirm('이 사진을 삭제할까요? 다른 멤버가 저장한 사본은 지워지지 않아요.'))return;
      en.photos.splice(d.p,1);if(!en.photos.length)e.entries.splice(d.e,1);save();$('#lb').classList.remove('on');renderAll()}
  })[d.act]?.();
});
renderHome();renderArchive();
</script>
</body>
</html>
